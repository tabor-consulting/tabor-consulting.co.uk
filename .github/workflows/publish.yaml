name: Fly Deploy
on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Initialize LXD's default profile before Workshop creates its own resources.
      - name: Set up Rockcraft and LXD
        uses: canonical/craft-actions/rockcraft/setup@67781aa5b0245eafdc6495760649c54c86059dfa
        with:
          lxd-channel: 6/stable

      - name: Launch Workshop
        uses: canonical/launch-workshop@b538173e2c4163488c4628b4aef79a6002475e76 # v1
        with:
          cache: go:mod-cache

      - name: Validate site and Go application
        run: |
          workshop run -- build
          workshop exec -- go vet ./...
          workshop exec -- go test ./...

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build rock
        uses: canonical/craft-actions/rockcraft/pack@67781aa5b0245eafdc6495760649c54c86059dfa
        with:
          lxd-channel: 6/stable

      - name: Upload container to ghcr.io
        run: |
          ROCK=$(ls *.rock)
          TAG=$(git rev-parse --short HEAD)
          sudo skopeo copy \
            oci-archive:${ROCK} \
            docker-daemon:ghcr.io/tabor-consulting/tabor-consulting.co.uk:${TAG}
          docker push ghcr.io/tabor-consulting/tabor-consulting.co.uk:${TAG}

      - name: Deploy to Fly.io
        run: workshop exec --env FLY_ACCESS_TOKEN -- flyctl deploy -i "ghcr.io/tabor-consulting/tabor-consulting.co.uk:$(git rev-parse --short HEAD)"
        env:
          FLY_ACCESS_TOKEN: ${{ secrets.FLY_API_TOKEN }}
