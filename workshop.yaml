name: tabor-consulting
base: ubuntu@26.04

sdks:
  - name: go
    channel: 1.27/stable
  - name: project-go-tools
  - name: project-hugo
    slots:
      hugo:
        interface: tunnel
        endpoint: localhost:1313
  - name: project-flyctl
  - name: system
    plugs:
      hugo:
        interface: tunnel
        endpoint: localhost:1313

connections:
  - plug: system:hugo
    slot: hugo:hugo

actions:
  build: |
    set -euo pipefail
    COMMIT=$(git rev-parse --short HEAD)
    go generate ./...
    go build -o tabor-consulting -ldflags "-X main.commit=${COMMIT}" "$@" .
  generate: |
    set -euo pipefail
    go generate "$@" ./...
  dev: |
    set -euo pipefail
    hugo serve --bind 0.0.0.0 -s site -F "$@"
